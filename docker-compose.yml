services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: truck-signs-api:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8020:8000"
    depends_on:
      - db

volumes:
  postgres_data: